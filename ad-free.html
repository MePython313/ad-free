<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniTube XP Edition — Ad-free YouTube</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>📺 MiniTube <span class="xp">XP</span> Edition</h1>
      <p>Watch YouTube ad-free! A app made by <span class="credits">Prakshit</span> @Hyd2026</p>
      <div class="shield" id="shield" title="AdBlocker: blocked requests are removed automatically">
        🛡️ <span id="blockedCount">0</span> ads blocked
      </div>
    </header>

    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search YouTube..." />
      <button id="searchBtn">🔍 Search</button>
    </div>

    <div class="toolbar">
      <input id="urlInput" type="text" placeholder="Paste a YouTube link (watch / short / youtu.be / live)..." />
      <button id="playBtn">▶ Play</button>
    </div>

    <div id="playerContainer">
      <div class="placeholder" id="placeholder">Paste a YouTube URL and hit Play 🎬</div>
    </div>

    <section class="history-section">
      <div class="history-head">
        <h2>🕘 Watch History</h2>
        <button id="clearHistoryBtn" class="btn-small" title="Clear all history">🗑 Clear</button>
      </div>
      <div id="history"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
